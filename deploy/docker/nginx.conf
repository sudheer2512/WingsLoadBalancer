# Stand-in for the external network load balancer in front of the gateway instances.
upstream wings_gateways {
    server gateway-01:8080 max_fails=2 fail_timeout=5s;
    server gateway-02:8080 max_fails=2 fail_timeout=5s;
    keepalive 64;
}
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80;
    client_max_body_size 200m;
    location / {
        proxy_pass http://wings_gateways;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
